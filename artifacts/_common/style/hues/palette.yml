# hue library of the artifacts: every colour value, named after its hue
# generates colors-values.tex beside this file; the house style and the concept bindings bind their roles to these hues
# a hue is retuned within its family, so its name stays true; a use never names a hue here
schema_version: 1
level: hues

layers:
  sama:
    gloss: hues recommended by Krees Sama for the poster series
    note: >-
      The hues follow the advice of Krees Sama, recorded in
      artifacts/mixture-input-encoding_poster_ccn2026/reviews/sama-krees.md. The azure and
      raspberry ladders tint one hue at constant hue, from the deep rung to the pale rung, and two
      adjacent rungs are not distinct.
    tokens:
      azuredeep: {value: "003A62", use: "azure, deep rung", pole: azure, rung: deep}
      azure: {value: "025F99", use: "azure, core rung", pole: azure, rung: core}
      azurebright: {value: "0B90E4", use: "azure, bright rung", pole: azure, rung: bright}
      azurelight: {value: "6EAEE6", use: "azure, light rung", pole: azure, rung: light}
      azurepale: {value: "D6EBFE", use: "azure, pale rung", pole: azure, rung: pale}
      raspberrydeep: {value: "79004F", use: "raspberry, deep rung", pole: raspberry, rung: deep}
      raspberry: {value: "A3136E", use: "raspberry, core rung", pole: raspberry, rung: core}
