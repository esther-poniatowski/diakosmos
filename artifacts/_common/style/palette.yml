# palette shared by the posters, the PINTS figure, the thesis proposal and the landing pages
# generates colors-values.tex and colors-roles.tex beside this file, and the CSS block of each landing page
# after an edit: run utils/scripts/build_palette.py, then utils/scripts/check_palette.py --spec on this file
schema_version: 1

layers:
  neutral:
    gloss: achromatic substrate of the page, the cards, the borders, the text and the plot axes
    note: >-
      The warm off-white page sets the pure white cards apart by temperature as well as by their
      glow. The text ramp runs from anthracite through slate to pearl.
    tokens:
      posterbg: {value: F6F3EE, use: off-white page}
      surface: {value: FFFFFF, use: every card, contrast: fill}
      questionwash:
        value: F2FBF7
        use: ground of the question cards
        contrast: fill
        note: >-
          The wash sits just above the page in lightness. A lighter wash comes closer to white
          than the page does, so a question card no longer stands apart from a plain card, and a
          wash below the page reads as a card pressed into it. In either case, the wash is dropped
          rather than nudged.
      bordersubtle: {value: DDDAD5, use: hairlines and dividers, contrast: fill}
      borderfunc: {value: 6F757A, use: "focus rings, emphasis boundaries and plot axes", contrast: mark}
      texttertiary: {value: 585F64, use: "captions, minor metadata and faint hints", contrast: mark}
      textsecondary: {value: 464E54, use: subtitles and supporting text, contrast: mark}
      textprimary: {value: 171E23, use: "titles, labels and body text", contrast: mark}
      textinverse: {value: FFFFFF, use: text set on the deep chrome}

  chrome:
    gloss: identity colour and its reserved complement, for headings, boxes, badges and pointers away from the page
    note: >-
      Every chrome use reaches these tokens through a role, so retuning chromecore repaints the
      identity layer and nothing else. The core is dark because it must hold a numbered badge, a
      2 pt ring and a thin connector outline at reading distance.
    tokens:
      chromecore: {value: 00454D, use: "numbers, icons, rings, kickers and the connector spine", contrast: mark}
      chromedeep: {value: 002D32, use: "chrome carrying white text, such as the contact line and the badges", contrast: mark}
      chromealt:
        value: 6E2B04
        use: reserved complement, still undrawn
        contrast: mark
        note: >-
          The deep russet clears both warm semantic tokens, so spending it needs no new
          measurement of the warm half.
      netfill:
        value: F7FBFB
        use: body wash of the medallion network
        contrast: fill
        note: >-
          The wash is chrome and carries no concept. The boundary of the network marks it, so
          its fill stays nearly invisible.

  semantic:
    gloss: one concept, one colour, drawn in figures only
    note: >-
      Each transformation is a constant-hue tint of its source, so that the projection reads as
      the operation of the input and the reweighting as the operation of the recurrence. Blue
      reads exogenous and directional, and magenta endogenous and self-reinforcing, as the input
      arrives from outside and the recurrence feeds back on itself. Therefore, each pole holds one
      ladder: deep for the card chrome, which carries white text; core for the source concept;
      bright for the transformation; light for a second pattern; pale for fills. Adjacent rungs
      are not distinct, so a figure draws at most three rungs of one pole and skips a rung
      between any two of them. The two pale fills are too close to encode their pole, so a pale
      fill always carries a saturated stroke of its own pole. A fourth distinction goes to a
      non-colour channel, such as a subscript or a line style. The token modelnet is the only
      licensed exception to the separation of chrome and concepts.
    tokens:
      inputdeep: {value: 003A62, pole: input, rung: deep, use: "input pattern 1, and the chrome of the projection card", contrast: mark}
      inputcore: {value: 025F99, pole: input, rung: core, use: the external input itself, contrast: mark}
      inputbright: {value: 0B90E4, pole: input, rung: bright, use: the feedforward projection, contrast: mark}
      inputlight:
        value: 6EAEE6
        pole: input
        rung: light
        use: input pattern 2
        contrast: mark
        below_floor: drawn only inside framed cell grids
        note: >-
          A darker light rung moves the input ladder into the range of component 2.
      inputpale: {value: D6EBFE, pole: input, rung: pale, use: input pooling, contrast: fill}
      recurdeep: {value: 79004F, pole: recur, rung: deep, use: "recurrent pattern 1, and the chrome of the reweighting card", contrast: mark}
      recurcore: {value: A3136E, pole: recur, rung: core, use: the recurrent connectivity itself, contrast: mark}
      recurbright: {value: CE298E, pole: recur, rung: bright, use: the recurrent reweighting, contrast: mark}
      recurlight:
        value: E081B1
        pole: recur
        rung: light
        use: recurrent pattern 2
        contrast: mark
        below_floor: drawn only inside framed cell grids
        note: >-
          A darker light rung moves the recurrent ladder toward the range of component 2, as
          for the input ladder.
      recurpale: {value: FFDBEB, pole: recur, rung: pale, use: recurrent pooling, contrast: fill}
      comp1: {value: C44214, use: component response 1, contrast: mark}
      comp2:
        value: 505E96
        use: component response 2
        contrast: mark
        note: >-
          Component 2 shares the blue region with the input pole. It clears every input rung
          except inputcore, which holds only because no figure draws a core rung and a component
          together. The pair must be measured again before a component enters a figure that
          draws the input itself.
      mixresponse:
        value: 9B62DB
        use: the response, standing for the mixture, the network state and the reduced state
        contrast: mark
        note: >-
          The violet sits between the red and the blue of the two components, so the mixture
          reads as the blend of the two responses that it combines.
      compplane: {value: C1BDB5, use: components plane and proportional reference, contrast: fill}
      outplaneannot:
        value: A78700
        use: bias, on the balance axis, its pills and the bias arc
        contrast: mark
        note: >-
          The gold sits at the sRGB gamut boundary for its lightness, so a lighter gold drops
          under the contrast floor.
      outplane: {value: 12764B, use: "emergence, on the out-of-plane component and the in-plane pills", contrast: mark}
      modelnet:
        value: 308D79
        use: the network model, drawn solid with filled markers
        contrast: mark
        note: >-
          The token follows the chrome into the blue-green region, but sits greener and much
          lighter than chromecore, so that the model band does not read as two shades of the
          heading.
      modeldn: {value: 393E3F, use: "the divisive-normalization model, drawn dashed with hollow markers", contrast: mark}

roles:
  pageground: {of: posterbg, use: "full-bleed canvas, and the halo of the medallion"}
  cardground: {of: surface, use: interior of every card and column box}
  cardring: {of: bordersubtle, use: hairline frame of a plain card}
  cardcast:
    of: chromecore
    use: glow under every card
    note: >-
      The glow is the largest surface of the accent on the page, and the first to change when
      the identity colour changes. A neutral cast binds the role to cardshadow.
  cardshadow: {of: black, tint: 38, use: "grey drop shadow, the neutral alternative to a cast"}
  cardshadowdk: {of: black, tint: 52, use: deeper shadow of an emphasised box}
  boxringaccent:
    of: chromecore
    use: ring of the question and answer boxes
    note: >-
      A box on the question-to-answer spine wears the accent ring, and a supporting box wears
      the hairline. Binding this role to cardring removes the distinction, which is a legitimate
      design and the reason for two roles.
  boxringplain: {of: bordersubtle, use: "ring of the approach boxes, interpretations and predictions"}
  headaccent:
    of: chromecore
    use: heading device, with its icon tile, glyph, number badge and kicker
    note: The heading sentence is body text in textprimary, and takes no role.
  questionfill: {of: questionwash, use: ground of the two question boxes}
  questionring:
    of: boxringaccent
    use: ring of the two question boxes
    note: >-
      The question boxes take the accent ring of the answer boxes. Both roles of a question box
      are bound here, so that the box and its heading cannot fall out of step.
  bulletmark: {of: chromecore, use: check ring before every interpretation and prediction bullet}
  pointermark: {of: chromecore, use: "every pointer away from the poster, such as citations, references, the QR glyph and the supplement tags"}
  markdeep: {of: chromedeep, use: "chrome carrying text weight, such as the contact line and the argument chains of the supplement"}
  spinefill: {of: chromecore, use: "body of the connector arrows, drawn as a tint"}
  spineedge: {of: chromedeep, use: outline of the connector arrows}
  medallionring: {of: chromecore, use: ring of the medallion}
  medallioncast: {of: chromecore, use: glow of the medallion}
  netbound:
    of: chromecore
    use: boundary of the one-network container
    note: The boundary is chrome. It states that the neurons form one network, and makes no claim about them.
  figcallout: {of: chromecore, use: chrome annotation inside a plot}
  stepmark: {of: chromecore, use: numbered step markers of the approach block and their rule}
  factoraccent: {of: chromecore, use: "ground, ring and disc of the factor panel"}
  recurgain:
    of: recurdeep
    use: the gain
    note: >-
      The recurrent reweighting is the realizing transformation, and the gain parameterises it.
      The gain therefore rides with the recurrence, and is not an exogenous quantity. It takes the
      deep rung to stay distinct from the bright rung of the reweighting.
  projchrome: {of: inputdeep, use: "ring, glow, disc and classifier pill of the feedforward card"}
  ampchrome: {of: recurdeep, use: "ring, glow, disc and classifier pill of the amplification card"}
  projtransform: {of: inputbright, use: "the projection, where a call site means the transformation"}
  amptransform: {of: recurbright, use: "the amplification, where a call site means the transformation"}

modes:
  dark:
    gloss: dark rendering of the landing pages, under a dark colour scheme of the browser
    values:
      posterbg: "121819"
      surface: 1A2224
      bordersubtle: 2D3638
      textprimary: EEF1F2
      textsecondary: B2BABD
      texttertiary: 8F989B
      chromecore: 6CC4CC
      chromedeep: 4FAAB3
      textinverse: 0B1213
    # contrast floor of body text (WCAG AA): the pages set their text in these tokens
    tests:
      ground: posterbg
      contrast_floor: 4.5
      pairs:
        - {mark: textinverse, ground: chromedeep}

css:
  bg: posterbg
  surface: surface
  border: bordersubtle
  text: textprimary
  text-2: textsecondary
  text-3: texttertiary
  accent: chromecore
  badge-bg: chromedeep
  badge-fg: textinverse

tests:
  ground: posterbg
  de_floor: 0.15
  contrast_floor: 3.0
  groups:
    components, response and geometry: [comp1, comp2, mixresponse, outplane, outplaneannot]
    the two transformations, skipping a rung: [inputdeep, inputbright, recurdeep, recurbright]
    transformations against components: [inputbright, recurbright, comp1, comp2, mixresponse]
    the two models, and their neighbours: [modelnet, modeldn, comp2]
    chrome against every semantic token: [chromecore, comp1, comp2, mixresponse, inputbright, recurbright, modelnet]
  exempt:
    - pair: [chromecore, modelnet]
      channel: the licensed exception, with modelnet drawn as the chrome inside the model band only
    - pair: [outplane, outplaneannot]
      channel: line style, solid for the normal and dashed for the in-plane reference
  pairs:
    - {mark: textinverse, ground: chromedeep}

recolour:
  targets: [comp1, comp2]
  rows:
    - {name: vision, strategy: unmix, files: [gratings-red.png, gratings-green.png, gratings-mixture-plaid.png]}
    - {name: audition, strategy: unmix, files: [soundwave-red.png, soundwave-green.png, soundwave-mix.png]}
    - {name: olfaction, strategy: rotate, files: [odor-fume-pink.png, odor-fume-green.png, odor-mix.png]}
