# house style of the artifacts: the elements of the page, bound to the hue library
# generates colors-roles.tex beside this file, and the CSS block of each landing page
# after an edit: run utils/scripts/build_palette.py, then utils/scripts/check_palette.py --spec on this file
schema_version: 1
level: style
extends: artifacts/_common/style/hues/palette.yml

roles:
  posterbg:
    of: ivory
    use: "off-white page"
    note: >-
      The warm off-white page sets the pure white cards apart by temperature as well as by
      their glow. The text ramp runs from anthracite through slate to pearl.
  surface: {of: paperwhite, use: "every card", contrast: fill}
  questionwash:
    of: seafoam
    use: "ground of the question cards"
    contrast: fill
    note: >-
      The wash sits just above the page in lightness. A lighter wash comes closer to white
      than the page does, so a question card no longer stands apart from a plain card, and
      a wash below the page reads as a card pressed into it. In either case, the wash is
      dropped rather than nudged.
  bordersubtle: {of: pearl, use: "hairlines and dividers", contrast: fill}
  borderfunc: {of: pewter, use: "focus rings, emphasis boundaries and plot axes", contrast: mark}
  texttertiary: {of: ash, use: "captions, minor metadata and faint hints", contrast: mark}
  textsecondary: {of: slategrey, use: "subtitles and supporting text", contrast: mark}
  textprimary: {of: anthracite, use: "titles, labels and body text", contrast: mark}
  textinverse: {of: paperwhite, use: "text set on the deep chrome"}
  chromecore:
    of: petrol
    use: "numbers, icons, rings, kickers and the connector spine"
    contrast: mark
    note: >-
      Every chrome use reaches these tokens through a role, so retuning chromecore
      repaints the identity layer and nothing else. The core is dark because it must hold
      a numbered badge, a 2 pt ring and a thin connector outline at reading distance.
  chromedeep: {of: petroldeep, use: "chrome carrying white text, such as the contact line and the badges", contrast: mark}
  chromealt:
    of: russet
    use: "reserved complement, still undrawn"
    contrast: mark
    note: >-
      The deep russet clears both warm semantic tokens, so spending it needs no new
      measurement of the warm half.
  netfill:
    of: petrolwash
    use: "body wash of the medallion network"
    contrast: fill
    note: >-
      The wash is chrome and carries no concept. The boundary of the network marks it, so
      its fill stays nearly invisible.
  pageground: {of: posterbg, use: "full-bleed canvas, and the halo of the medallion"}
  cardground: {of: surface, use: "interior of every card and column box"}
  cardring: {of: bordersubtle, use: "hairline frame of a plain card"}
  cardcast:
    of: chromecore
    use: "glow under every card"
    note: >-
      The glow is the largest surface of the accent on the page, and the first to change
      when the identity colour changes. A neutral cast binds the role to cardshadow.
  cardshadow: {of: black, tint: 38, use: "grey drop shadow, the neutral alternative to a cast"}
  cardshadowdk: {of: black, tint: 52, use: "deeper shadow of an emphasised box"}
  boxringaccent:
    of: chromecore
    use: "ring of the question and answer boxes"
    note: >-
      A box on the question-to-answer spine wears the accent ring, and a supporting box
      wears the hairline. Binding this role to cardring removes the distinction, which is
      a legitimate design and the reason for two roles.
  boxringplain: {of: bordersubtle, use: "ring of the approach boxes, interpretations and predictions"}
  headaccent:
    of: chromecore
    use: "heading device, with its icon tile, glyph, number badge and kicker"
    note: >-
      The heading sentence is body text in textprimary, and takes no role.
  questionfill: {of: questionwash, use: "ground of the two question boxes"}
  questionring:
    of: boxringaccent
    use: "ring of the two question boxes"
    note: >-
      The question boxes take the accent ring of the answer boxes. Both roles of a
      question box are bound here, so that the box and its heading cannot fall out of
      step.
  bulletmark: {of: chromecore, use: "check ring before every interpretation and prediction bullet"}
  pointermark: {of: chromecore, use: "every pointer away from the poster, such as citations, references, the QR glyph and the supplement tags"}
  markdeep: {of: chromedeep, use: "chrome carrying text weight, such as the contact line and the argument chains of the supplement"}
  spinefill: {of: chromecore, use: "body of the connector arrows, drawn as a tint"}
  spineedge: {of: chromedeep, use: "outline of the connector arrows"}
  medallionring: {of: chromecore, use: "ring of the medallion"}
  medallioncast: {of: chromecore, use: "glow of the medallion"}
  netbound:
    of: chromecore
    use: "boundary of the one-network container"
    note: >-
      The boundary is chrome. It states that the neurons form one network, and makes no
      claim about them.
  figcallout: {of: chromecore, use: "chrome annotation inside a plot"}
  stepmark: {of: chromecore, use: "numbered step markers of the approach block and their rule"}
  factoraccent: {of: chromecore, use: "ground, ring and disc of the factor panel"}

modes:
  dark:
    gloss: dark rendering of the landing pages, under a dark colour scheme of the browser
    values:
      posterbg: "121819"
      surface: 1A2224
      bordersubtle: 2D3638
      textprimary: EEF1F2
      textsecondary: B2BABD
      texttertiary: 8F989B
      chromecore: 6CC4CC
      chromedeep: 4FAAB3
      textinverse: 0B1213
    # contrast floor of body text (WCAG AA): the pages set their text in these tokens
    tests:
      ground: posterbg
      contrast_floor: 4.5
      pairs:
        - {mark: textinverse, ground: chromedeep}



css:
  bg: posterbg
  surface: surface
  border: bordersubtle
  text: textprimary
  text-2: textsecondary
  text-3: texttertiary
  accent: chromecore
  badge-bg: chromedeep
  badge-fg: textinverse

tests:
  ground: posterbg
  de_floor: 0.15
  contrast_floor: 3.0
  pairs:
    - {mark: textinverse, ground: chromedeep}
