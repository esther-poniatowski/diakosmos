name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.unicode-engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        unicode-engine:
          - lualatex
          - xelatex
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install source checker
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install TeX Live
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          packages: >-
            scheme-basic
            collection-fontsrecommended
            collection-latexextra
            collection-latexrecommended
            collection-luatex
            collection-xetex
            l3build
            latexmk
            raleway
            sourcecodepro
            sourcesans
      - name: Verify the package
        env:
          DIAKOSMOS_UNICODE_ENGINE: ${{ matrix.unicode-engine }}
        run: scripts/check.sh
